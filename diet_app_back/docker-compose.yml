version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: diet_app_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: diet_app
      MYSQL_USER: diet_user
      MYSQL_PASSWORD: diet_password
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: