spring:
  datasource:
    url: jdbc:mysql://localhost:3306/diet_app?useSSL=false&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true
    username: diet_user
    password: diet_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      continue-on-error: false
      schema-locations:
        - classpath:sql/create_diet_users.sql
        - classpath:sql/create_foods.sql
        - classpath:sql/create_snarky_messages.sql
        - classpath:sql/create_food_records.sql
      data-locations:
        - classpath:sql/insert_diet_users.sql
        - classpath:sql/insert_foods.sql
        - classpath:sql/insert_snarky_messages.sql

        